spring.application.name=TaskFlow

# --- Optional local-only overrides (git-ignored: backend/local-secrets.properties) ---
spring.config.import=optional:file:./local-secrets.properties

# --- MySQL ---
# Local defaults; every value can be overridden by an environment variable
# with the same name (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, ...).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/taskflowdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# --- JWT ---
# No default: production MUST set APP_JWT_SECRET. Locally it comes from
# backend/local-secrets.properties (git-ignored).
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=604800000

# --- CORS (frontend origins, comma-separated) ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# --- GitHub OAuth App ---
# Create one at https://github.com/settings/developers
#   Homepage URL:              your frontend URL (e.g. https://taskflow.netlify.app)
#   Authorization callback URL: your backend URL + /api/github/oauth/callback
# No defaults: credentials come from backend/local-secrets.properties locally
# and environment variables on the cloud host.
app.github.client-id=${APP_GITHUB_CLIENT_ID}
app.github.client-secret=${APP_GITHUB_CLIENT_SECRET}
app.github.redirect-uri=${APP_GITHUB_REDIRECT_URI:http://localhost:8080/api/github/oauth/callback}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
